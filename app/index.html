<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f6f4" />
  <title>Pedidos</title>
  <link rel="stylesheet" href="base.css" />
  <style>
    .cabecera {
      position: sticky; top: 0; z-index: 50; background: var(--fondo);
      border-bottom: 1px solid var(--borde); padding: 14px 16px 12px;
    }
    .cabecera-fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .negocio { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--tenue); }
    .cliente-nombre { font-size: 22px; font-weight: 800; line-height: 1.15; margin-top: 4px; }
    .contenido { max-width: 640px; margin: 0 auto; padding: 0 16px; }

    .estado-pantalla { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 32px 8px; }
    .estado-pantalla h2 { font-size: 20px; }
    .estado-pantalla p { color: var(--tenue); }

    .titulo-seccion { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--tenue); margin: 20px 0 10px; }

    /* Calendario */
    .calendario { background: var(--superficie); border: 1px solid var(--borde); border-radius: 16px; padding: 10px 10px 12px; }
    .cal-cab { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 8px; }
    .cal-mes { font-weight: 700; text-transform: capitalize; }
    .cal-nav { width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; font-size: 20px; }
    .cal-nav:hover:not(:disabled) { background: var(--superficie-2); }
    .cal-nav:disabled { opacity: .25; cursor: default; }
    .cal-semana, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-semana div { text-align: center; font-size: 11px; font-weight: 700; color: var(--tenue); padding: 4px 0; }
    .cal-dia {
      aspect-ratio: 1; border: 0; background: transparent; border-radius: 10px;
      font-size: 15px; font-weight: 600; position: relative;
    }
    .cal-dia:disabled { color: #c5c5bf; cursor: default; font-weight: 400; }
    .cal-dia.disponible:hover { background: var(--superficie-2); }
    .cal-dia.con-pedido { box-shadow: inset 0 0 0 2px var(--resalte-suave); color: var(--resalte); }
    .cal-dia.con-pedido::after {
      content: ''; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
      width: 5px; height: 5px; border-radius: 50%; background: var(--resalte);
    }
    .cal-dia.seleccionado { background: var(--acento); color: var(--acento-texto); box-shadow: none; }
    .cal-dia.seleccionado::after { background: var(--acento-texto); }
    .fecha-elegida { text-align: center; margin-top: 10px; color: var(--tenue); font-size: 14px; }
    .fecha-elegida strong { color: var(--texto); }

    .aviso { margin-top: 14px; padding: 12px 14px; border-radius: var(--radio); background: var(--resalte-suave); color: var(--resalte); font-size: 14px; }
    .aviso button { margin-top: 8px; }

    /* Productos */
    .sucursal { margin-top: 18px; }
    .sucursal-cab { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 2px solid var(--texto); }
    .sucursal-cab h3 { font-size: 17px; }
    .categoria { font-size: 12px; font-weight: 700; color: var(--tenue); letter-spacing: .08em; text-transform: uppercase; padding: 14px 0 4px; }
    .producto { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--borde); }
    .producto-info { flex: 1; min-width: 0; }
    .producto-nombre { font-weight: 600; }
    .producto-pres { font-size: 13px; color: var(--tenue); }
    .cantidad { display: flex; align-items: center; background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px; flex-shrink: 0; }
    .cantidad button { width: 44px; height: 44px; border: 0; background: transparent; font-size: 22px; color: var(--texto); border-radius: 12px; }
    .cantidad button:active { background: var(--superficie-2); }
    .cantidad .num { min-width: 40px; height: 44px; border: 0; background: transparent; font-weight: 700; font-size: 16px; }
    .cantidad .num.activo { color: var(--resalte); }
    .bloqueado { opacity: .4; pointer-events: none; }

    textarea.notas { width: 100%; min-height: 80px; resize: vertical; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 12px; outline: none; }
    textarea.notas:focus { border-color: var(--acento); }
    .relleno-inferior { height: 130px; }

    /* Barra inferior */
    .barra {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      background: var(--superficie); border-top: 1px solid var(--borde);
      padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
      transform: translateY(110%); transition: transform .25s;
    }
    .barra.visible { transform: translateY(0); }
    .barra-interior { max-width: 640px; margin: 0 auto; }
    .barra-info { display: flex; justify-content: space-between; font-size: 14px; color: var(--tenue); margin-bottom: 8px; }
    .barra-info strong { color: var(--texto); }
    .barra .btn { width: 100%; padding: 14px; font-size: 16px; }

    /* Teclado numérico */
    .teclado-fondo { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; }
    .teclado-fondo.visible { display: flex; }
    .teclado { width: 100%; max-width: 480px; background: var(--superficie); border-radius: 20px 20px 0 0; padding: 18px 16px calc(22px + env(safe-area-inset-bottom)); }
    .teclado-titulo { font-weight: 700; }
    .teclado-sub { font-size: 13px; color: var(--tenue); margin-bottom: 10px; }
    .teclado-pantalla { background: var(--superficie-2); border-radius: 14px; height: 70px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; margin-bottom: 12px; }
    .teclado-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tecla { height: 58px; border: 0; border-radius: 14px; background: var(--superficie-2); font-size: 22px; font-weight: 600; }
    .tecla:active { transform: scale(.96); }
    .tecla.ok { background: var(--acento); color: var(--acento-texto); font-size: 17px; }

    /* Historial */
    .cajon-fondo { position: fixed; inset: 0; z-index: 250; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; }
    .cajon-fondo.visible { display: flex; }
    .cajon { width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; background: var(--fondo); border-radius: 20px 20px 0 0; padding: 18px 16px 32px; }
    .cajon-cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .cajon-cab h2 { font-size: 20px; }
    .tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 14px; margin-bottom: 10px; }
    .tarjeta-cab { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
    .tarjeta-fecha { font-weight: 700; }
    .tarjeta-sub { font-size: 12px; color: var(--tenue); }
    .tarjeta-suc { font-size: 12px; font-weight: 700; color: var(--tenue); text-transform: uppercase; letter-spacing: .06em; margin-top: 8px; }
    .tarjeta-linea { font-size: 14px; display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
    .tarjeta-notas { font-size: 13px; color: var(--tenue); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--borde); }

    .exito { text-align: center; }
    .exito-icono { width: 56px; height: 56px; border-radius: 50%; background: var(--resalte-suave); color: var(--resalte); font-size: 30px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
    .exito p { color: var(--tenue); margin-bottom: 18px; }
    .exito .btn { width: 100%; padding: 13px; margin-top: 8px; }
    .btn.whatsapp { background: #1f8f4e; border-color: #1f8f4e; color: #fff; }
  </style>
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-fila">
      <div class="negocio" id="negocio">PROVEEDOR</div>
      <button class="btn chico" id="btnHistorial" hidden>Mis pedidos</button>
    </div>
    <div class="cliente-nombre" id="clienteNombre"></div>
  </header>

  <main class="contenido" id="contenido">
    <div class="estado-pantalla"><div class="spinner"></div><p>Cargando…</p></div>
  </main>
  <div class="relleno-inferior"></div>

  <div class="barra" id="barra">
    <div class="barra-interior">
      <div class="barra-info"><span id="barraFecha"></span><strong id="barraCuenta"></strong></div>
      <button class="btn primario" id="btnEnviar">Enviar pedido</button>
    </div>
  </div>

  <div class="teclado-fondo" id="tecladoFondo">
    <div class="teclado" role="dialog" aria-label="Escribir cantidad">
      <div class="teclado-titulo" id="tecladoTitulo"></div>
      <div class="teclado-sub" id="tecladoSub"></div>
      <div class="teclado-pantalla" id="tecladoPantalla">0</div>
      <div class="teclado-grid" id="tecladoGrid">
        <button class="tecla" data-k="7">7</button><button class="tecla" data-k="8">8</button><button class="tecla" data-k="9">9</button>
        <button class="tecla" data-k="4">4</button><button class="tecla" data-k="5">5</button><button class="tecla" data-k="6">6</button>
        <button class="tecla" data-k="1">1</button><button class="tecla" data-k="2">2</button><button class="tecla" data-k="3">3</button>
        <button class="tecla" data-k="borrar" aria-label="Borrar">⌫</button><button class="tecla" data-k="0">0</button><button class="tecla ok" data-k="ok">Listo</button>
      </div>
    </div>
  </div>

  <div class="modal-fondo" id="modalExito">
    <div class="modal exito">
      <div class="exito-icono">✓</div>
      <h2 id="exitoTitulo">¡Pedido enviado!</h2>
      <p id="exitoTexto"></p>
      <button class="btn whatsapp" id="btnWhatsApp">Avisar por WhatsApp</button>
      <button class="btn" id="btnCerrarExito">Cerrar</button>
    </div>
  </div>

  <div class="cajon-fondo" id="historialFondo">
    <div class="cajon">
      <div class="cajon-cab"><h2>Mis pedidos</h2><button class="btn chico" id="btnCerrarHistorial">Cerrar</button></div>
      <div id="historialContenido"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="comun.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get('c');
    const db = conectarSupabase();

    let datos = null;            // respuesta de cliente_por_token
    let sucursales = [];         // [{id, nombre}] o [{id: null, nombre: ''}] si no tiene
    let pedidos = [];            // pedidos recientes del cliente
    let cantidades = {};         // { 'iSucursal:iProducto': número }
    let fechaElegida = null;
    let mesVisible = null;       // 'AAAA-MM'
    let ultimoPedido = null;

    const $ = (id) => document.getElementById(id);

    function pantallaEstado(titulo, texto) {
      $('contenido').innerHTML = `<div class="estado-pantalla"><h2>${esc(titulo)}</h2><p>${esc(texto)}</p></div>`;
    }

    async function iniciar() {
      if (!db) return pantallaEstado('Falta configurar', 'El sistema aún no está conectado a la base de datos.');
      if (!token) return pantallaEstado('Link incompleto', 'Pide a tu proveedor el link para hacer pedidos.');

      const { data, error } = await db.rpc('cliente_por_token', { p_token: token });
      if (error) return pantallaEstado('No se pudo cargar', mensajeError(error));
      if (!data) return pantallaEstado('Link no válido', 'Este link ya no funciona. Pide uno nuevo a tu proveedor.');

      datos = data;
      sucursales = data.sucursales.length ? data.sucursales : [{ id: null, nombre: '' }];
      $('negocio').textContent = data.negocio.nombre;
      $('clienteNombre').textContent = data.cliente.nombre;
      document.title = `Pedidos · ${data.cliente.nombre}`;
      $('btnHistorial').hidden = false;
      mesVisible = data.fecha_minima.slice(0, 7);

      if (!data.productos.length) {
        return pantallaEstado('Sin productos', 'Tu proveedor todavía no te ha asignado productos.');
      }
      await cargarPedidos();
      dibujar();
    }

    async function cargarPedidos() {
      const { data } = await db.rpc('pedidos_por_token', { p_token: token });
      pedidos = data || [];
    }

    const pedidoDelDia = (fecha) => pedidos.find((p) => p.fecha_entrega === fecha && p.estado !== 'cancelado');

    function dibujar() {
      const porCategoria = {};
      datos.productos.forEach((p, i) => (porCategoria[p.categoria] ||= []).push([p, i]));

      const bloques = sucursales.map((s, si) => `
        <section class="sucursal">
          ${s.nombre ? `<div class="sucursal-cab"><h3>${esc(s.nombre)}</h3><span class="etiqueta" id="total-${si}">0</span></div>` : ''}
          ${Object.entries(porCategoria).map(([cat, lista]) => `
            <div class="categoria">${esc(cat)}</div>
            ${lista.map(([p, pi]) => `
              <div class="producto">
                <div class="producto-info">
                  <div class="producto-nombre">${esc(p.nombre)}</div>
                  <div class="producto-pres">${esc(textoPresentacion(p))}</div>
                </div>
                <div class="cantidad">
                  <button data-clave="${si}:${pi}" data-paso="-1" aria-label="Menos">−</button>
                  <button class="num" id="num-${si}-${pi}" data-clave="${si}:${pi}" aria-label="Escribir cantidad">0</button>
                  <button data-clave="${si}:${pi}" data-paso="1" aria-label="Más">+</button>
                </div>
              </div>`).join('')}
          `).join('')}
        </section>`).join('');

      $('contenido').innerHTML = `
        <div class="titulo-seccion">1. Fecha de entrega</div>
        <div class="calendario" id="calendario"></div>
        <div class="fecha-elegida" id="fechaElegida">Elige el día en que quieres recibir tu pedido</div>
        <div id="avisoDia"></div>
        <div id="formulario" class="bloqueado">
          <div class="titulo-seccion">2. Productos</div>
          ${bloques}
          <div class="titulo-seccion">3. Notas (opcional)</div>
          <textarea class="notas" id="notas" maxlength="500" placeholder="Indicaciones para la entrega, cambios, etc."></textarea>
        </div>`;

      $('formulario').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-clave]');
        if (!b) return;
        if (b.dataset.paso) cambiar(b.dataset.clave, Number(b.dataset.paso));
        else abrirTeclado(b.dataset.clave);
      });
      dibujarCalendario();
    }

    function dibujarCalendario() {
      const min = datos.fecha_minima;
      const max = sumarDias(min, 90);
      const [anio, mes] = mesVisible.split('-').map(Number);
      const primerDia = new Date(Date.UTC(anio, mes - 1, 1));
      const diasMes = new Date(Date.UTC(anio, mes, 0)).getUTCDate();
      const desfase = (primerDia.getUTCDay() + 6) % 7;   // semana inicia en lunes
      const nombreMes = primerDia.toLocaleDateString('es-MX', { month: 'long', year: 'numeric', timeZone: 'UTC' });

      let celdas = '<div></div>'.repeat(desfase);
      for (let d = 1; d <= diasMes; d++) {
        const f = `${mesVisible}-${String(d).padStart(2, '0')}`;
        const habilitado = f >= min && f <= max;
        const clases = ['cal-dia', habilitado ? 'disponible' : '', pedidoDelDia(f) ? 'con-pedido' : '', f === fechaElegida ? 'seleccionado' : ''].join(' ');
        celdas += `<button class="${clases}" data-fecha="${f}" ${habilitado ? '' : 'disabled'}>${d}</button>`;
      }

      $('calendario').innerHTML = `
        <div class="cal-cab">
          <button class="cal-nav" id="mesAnterior" aria-label="Mes anterior" ${mesVisible <= min.slice(0, 7) ? 'disabled' : ''}>‹</button>
          <div class="cal-mes">${esc(nombreMes)}</div>
          <button class="cal-nav" id="mesSiguiente" aria-label="Mes siguiente" ${mesVisible >= max.slice(0, 7) ? 'disabled' : ''}>›</button>
        </div>
        <div class="cal-semana"><div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div></div>
        <div class="cal-grid">${celdas}</div>`;

      $('mesAnterior').onclick = () => moverMes(-1);
      $('mesSiguiente').onclick = () => moverMes(1);
      $('calendario').querySelectorAll('.cal-dia:not(:disabled)').forEach((b) => (b.onclick = () => elegirFecha(b.dataset.fecha)));
    }

    function moverMes(n) {
      const [a, m] = mesVisible.split('-').map(Number);
      const d = new Date(Date.UTC(a, m - 1 + n, 1));
      mesVisible = d.toISOString().slice(0, 7);
      dibujarCalendario();
    }

    function elegirFecha(fecha) {
      fechaElegida = fecha;
      dibujarCalendario();
      $('fechaElegida').innerHTML = `Entrega: <strong>${esc(fechaLarga(fecha))}</strong>`;
      const existente = pedidoDelDia(fecha);
      if (existente) {
        $('avisoDia').innerHTML = `<div class="aviso">Ya tienes el pedido <strong>#${esc(existente.folio)}</strong> para este día.<br>
          <button class="btn chico" id="verPedido">Ver mis pedidos</button></div>`;
        $('verPedido').onclick = abrirHistorial;
        $('formulario').classList.add('bloqueado');
      } else {
        $('avisoDia').innerHTML = '';
        $('formulario').classList.remove('bloqueado');
      }
      actualizarBarra();
    }

    function cambiar(clave, paso) {
      fijarCantidad(clave, (cantidades[clave] || 0) + paso);
    }

    function fijarCantidad(clave, valor) {
      cantidades[clave] = Math.max(0, Math.min(999, valor || 0));
      const [si, pi] = clave.split(':');
      const el = $(`num-${si}-${pi}`);
      el.textContent = cantidades[clave];
      el.classList.toggle('activo', cantidades[clave] > 0);
      const totalSuc = $(`total-${si}`);
      if (totalSuc) {
        const n = Object.entries(cantidades).filter(([k, v]) => k.startsWith(`${si}:`) && v > 0).length;
        totalSuc.textContent = n;
      }
      actualizarBarra();
    }

    function lineasDelPedido() {
      return Object.entries(cantidades)
        .filter(([, v]) => v > 0)
        .map(([clave, cantidad]) => {
          const [si, pi] = clave.split(':').map(Number);
          return { sucursal_id: sucursales[si].id, producto_id: datos.productos[pi].id, cantidad };
        });
    }

    function actualizarBarra() {
      const n = lineasDelPedido().length;
      const visible = n > 0 && fechaElegida && !pedidoDelDia(fechaElegida);
      $('barra').classList.toggle('visible', !!visible);
      if (visible) {
        $('barraCuenta').textContent = `${n} ${n === 1 ? 'producto' : 'productos'}`;
        $('barraFecha').textContent = fechaCorta(fechaElegida);
      }
    }

    // Teclado numérico
    let claveTeclado = null, valorTeclado = '';
    function abrirTeclado(clave) {
      claveTeclado = clave;
      valorTeclado = cantidades[clave] ? String(cantidades[clave]) : '';
      const [si, pi] = clave.split(':').map(Number);
      const p = datos.productos[pi];
      $('tecladoTitulo').textContent = p.nombre;
      $('tecladoSub').textContent = [sucursales[si].nombre, textoPresentacion(p)].filter(Boolean).join(' · ');
      $('tecladoPantalla').textContent = valorTeclado || '0';
      $('tecladoFondo').classList.add('visible');
    }
    $('tecladoGrid').addEventListener('click', (e) => {
      const k = e.target.closest('.tecla')?.dataset.k;
      if (!k) return;
      if (k === 'ok') {
        fijarCantidad(claveTeclado, parseInt(valorTeclado, 10) || 0);
        $('tecladoFondo').classList.remove('visible');
        return;
      }
      if (k === 'borrar') valorTeclado = valorTeclado.slice(0, -1);
      else if (valorTeclado.length < 3) valorTeclado = (valorTeclado + k).replace(/^0+(?=\d)/, '');
      $('tecladoPantalla').textContent = valorTeclado || '0';
    });
    $('tecladoFondo').addEventListener('click', (e) => {
      if (e.target.id === 'tecladoFondo') $('tecladoFondo').classList.remove('visible');
    });

    // Enviar
    $('btnEnviar').addEventListener('click', async () => {
      const lineas = lineasDelPedido();
      if (!fechaElegida || !lineas.length) return;
      const btn = $('btnEnviar');
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      const notas = $('notas').value.trim();
      const { data, error } = await db.rpc('crear_pedido', {
        p_token: token, p_fecha_entrega: fechaElegida, p_lineas: lineas, p_notas: notas,
      });
      btn.disabled = false;
      btn.textContent = 'Enviar pedido';
      if (error) return mostrarToast(mensajeError(error), 'error');

      ultimoPedido = { folio: data.folio, fecha: fechaElegida, lineas, notas };
      $('exitoTitulo').textContent = `¡Pedido #${data.folio} enviado!`;
      $('exitoTexto').textContent = `Lo recibirás el ${fechaLarga(fechaElegida).toLowerCase()}. Te avisaremos cuando lo confirmemos.`;
      $('modalExito').classList.add('visible');

      await cargarPedidos();
      Object.keys(cantidades).forEach((k) => fijarCantidad(k, 0));
      $('notas').value = '';
      elegirFecha(fechaElegida);
    });

    $('btnCerrarExito').onclick = () => $('modalExito').classList.remove('visible');

    $('btnWhatsApp').onclick = () => {
      if (!ultimoPedido) return;
      let msg = `*Pedido #${ultimoPedido.folio}*\n${datos.cliente.nombre}\nEntrega: ${fechaLarga(ultimoPedido.fecha, true)}\n`;
      sucursales.forEach((s) => {
        const items = ultimoPedido.lineas.filter((l) => l.sucursal_id === s.id);
        if (!items.length) return;
        msg += s.nombre ? `\n*${s.nombre}*\n` : '\n';
        items.forEach((l) => {
          const p = datos.productos.find((x) => x.id === l.producto_id);
          msg += `• ${p.nombre}${p.presentacion ? ` (${p.presentacion})` : ''}: *${l.cantidad}*\n`;
        });
      });
      if (ultimoPedido.notas) msg += `\nNotas: ${ultimoPedido.notas}`;
      const numero = datos.negocio.whatsapp || '';
      window.open(`https://wa.me/${numero}?text=${encodeURIComponent(msg)}`, '_blank');
    };

    // Historial
    async function abrirHistorial() {
      $('historialFondo').classList.add('visible');
      $('historialContenido').innerHTML = '<div class="vacio">Cargando…</div>';
      await cargarPedidos();
      if (!pedidos.length) {
        $('historialContenido').innerHTML = '<div class="vacio">Aún no tienes pedidos recientes.</div>';
        return;
      }
      $('historialContenido').innerHTML = pedidos.map((p) => {
        const porSuc = {};
        p.lineas.forEach((l) => (porSuc[l.sucursal] ||= []).push(l));
        return `
          <div class="tarjeta">
            <div class="tarjeta-cab">
              <div>
                <div class="tarjeta-fecha">${esc(fechaLarga(p.fecha_entrega))}</div>
                <div class="tarjeta-sub">Pedido #${esc(p.folio)}</div>
              </div>
              <span class="etiqueta ${esc(p.estado)}">${esc(ESTADOS[p.estado] || p.estado)}</span>
            </div>
            ${Object.entries(porSuc).map(([suc, ls]) => `
              ${suc ? `<div class="tarjeta-suc">${esc(suc)}</div>` : ''}
              ${ls.map((l) => `<div class="tarjeta-linea"><span>${esc(l.producto)} <span class="tarjeta-sub">${esc(l.presentacion)}</span></span><strong>${esc(l.cantidad)}</strong></div>`).join('')}
            `).join('')}
            ${p.notas ? `<div class="tarjeta-notas">${esc(p.notas)}</div>` : ''}
          </div>`;
      }).join('');
    }
    $('btnHistorial').onclick = abrirHistorial;
    $('btnCerrarHistorial').onclick = () => $('historialFondo').classList.remove('visible');
    $('historialFondo').addEventListener('click', (e) => {
      if (e.target.id === 'historialFondo') $('historialFondo').classList.remove('visible');
    });

    iniciar();
  </script>
</body>
</html>
