<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121a2b" media="(prefers-color-scheme: dark)" />
  <title>Pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="base.css" />
  <style>
    body { font-size: 15px; }
    .cabecera {
      position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--superficie) 88%, transparent);
      backdrop-filter: saturate(1.6) blur(12px); -webkit-backdrop-filter: saturate(1.6) blur(12px);
      border-bottom: 1px solid var(--borde);
    }
    .cabecera-interior { max-width: 680px; margin: 0 auto; padding: 12px 16px 12px; }
    .cabecera-fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .cabecera .marca-logo { width: 30px; height: 30px; border-radius: 8px; }
    .negocio { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--texto-2); }
    .saludo { margin-top: 12px; }
    .saludo small { display: block; color: var(--tenue); font-size: 13px; }
    .cliente-nombre { font-size: 22px; font-weight: 750; line-height: 1.15; letter-spacing: -.02em; }
    .chips { display: flex; gap: 6px; overflow-x: auto; margin: 12px -16px -2px; padding: 0 16px 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chips button { flex: 0 0 auto; border: 1px solid var(--borde); background: var(--superficie); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 600; color: var(--texto-2); }
    .chips button:hover { border-color: var(--acento-borde); color: var(--acento-tinta); }
    .contenido { max-width: 680px; margin: 0 auto; padding: 0 16px; }

    .estado-pantalla { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 32px 8px; }
    .estado-pantalla h2 { font-size: 20px; }
    .estado-pantalla p { color: var(--tenue); max-width: 340px; }
    .estado-pantalla .vacio-icono { width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: var(--acento-suave); color: var(--acento-tinta); }

    .titulo-seccion { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 26px 0 12px; }
    .titulo-seccion h2 { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
    .titulo-seccion h2 .n { width: 24px; height: 24px; border-radius: 50%; background: var(--acento); color: var(--acento-texto); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
    .titulo-seccion h2 small { font-weight: 500; color: var(--tenue); font-size: 13px; }

    /* Calendario (dentro del modal «Otra fecha») */
    .cal-cab { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 8px; }
    .cal-mes { font-weight: 700; text-transform: capitalize; }
    .cal-nav { width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; }
    .cal-nav:hover:not(:disabled) { background: var(--superficie-2); }
    .cal-nav:disabled { opacity: .25; cursor: default; }
    .cal-semana, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-semana div { text-align: center; font-size: 11px; font-weight: 700; color: var(--tenue); padding: 4px 0; }
    .cal-dia { aspect-ratio: 1; border: 0; background: transparent; border-radius: 10px; font-size: 15px; font-weight: 600; position: relative; }
    .cal-dia:disabled { color: var(--tenue-2); opacity: .55; cursor: default; font-weight: 400; }
    .cal-dia.disponible:hover { background: var(--superficie-2); }
    .cal-dia.con-pedido { box-shadow: inset 0 0 0 2px var(--exito-suave); color: var(--exito); }
    .cal-dia.con-pedido::after { content: ''; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--exito); }
    .cal-dia.seleccionado { background: var(--acento); color: var(--acento-texto); box-shadow: none; }

    .fecha-elegida { margin-top: 4px; color: var(--tenue); font-size: 14px; display: flex; align-items: center; gap: 7px; }
    .fecha-elegida strong { color: var(--texto); }
    .aviso { margin-top: 12px; padding: 12px 14px; border-radius: var(--radio); background: var(--exito-suave); color: var(--exito); font-size: 14px; border: 1px solid color-mix(in srgb, var(--exito) 25%, transparent); }
    .aviso button { margin-top: 8px; }

    /* Productos */
    .sucursal { margin-top: 18px; scroll-margin-top: 170px; }
    .sucursal-cab { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 10px; }
    .sucursal-cab h3 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .sucursal-cab h3 .ico { color: var(--acento-tinta); }
    .grupo-cat { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio-l); box-shadow: var(--sombra-1); margin-bottom: 12px; overflow: hidden; scroll-margin-top: 170px; }
    .categoria { font-size: 12px; font-weight: 700; color: var(--tenue); letter-spacing: .08em; text-transform: uppercase; padding: 12px 16px 4px; }
    .producto { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--borde); }
    .categoria + .producto { border-top: 0; }
    .producto.con-cantidad { background: color-mix(in srgb, var(--acento-suave) 70%, var(--superficie)); }
    .producto-info { flex: 1; min-width: 0; }
    .producto-nombre { font-weight: 600; }
    .producto-pres { font-size: 13px; color: var(--tenue); }
    .producto-precio { font-size: 14px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
    .producto-precio .sub { color: var(--acento-tinta); font-weight: 700; margin-left: 6px; }
    .producto-precio.sin-precio { color: var(--aviso); font-weight: 600; font-size: 13px; }
    .cantidad { display: flex; align-items: center; background: var(--superficie-2); border: 1px solid var(--borde); border-radius: 12px; flex-shrink: 0; }
    .cantidad button { width: 44px; height: 44px; border: 0; background: transparent; font-size: 22px; color: var(--texto); border-radius: 12px; }
    .cantidad button:active { background: var(--superficie-3); }
    .cantidad button:disabled { opacity: .3; cursor: not-allowed; }
    .cantidad .num { min-width: 40px; height: 44px; border: 0; background: transparent; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
    .cantidad .num.activo { color: var(--acento-tinta); }
    .producto.con-cantidad .cantidad { background: var(--superficie); border-color: var(--acento-borde); }
    .bloqueado { opacity: .4; pointer-events: none; filter: grayscale(.4); }

    textarea.notas { width: 100%; min-height: 84px; resize: vertical; background: var(--superficie); border: 1px solid var(--borde-fuerte); border-radius: var(--radio); padding: 12px 14px; outline: none; }
    textarea.notas:focus { border-color: var(--acento); box-shadow: var(--anillo); }
    .relleno-inferior { height: 150px; }

    /* Barra inferior */
    .barra {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 0 12px calc(12px + env(safe-area-inset-bottom));
      transform: translateY(130%); transition: transform .3s cubic-bezier(.2, .8, .2, 1); pointer-events: none;
    }
    .barra.visible { transform: translateY(0); pointer-events: auto; }
    .barra-interior {
      max-width: 656px; margin: 0 auto; background: var(--superficie); border: 1px solid var(--borde);
      border-radius: 18px; padding: 12px 12px 12px 16px; box-shadow: var(--sombra-3); display: flex; align-items: center; gap: 12px;
    }
    .barra-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .barra-info span { font-size: 13px; color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .barra-info strong { color: var(--texto); font-size: 19px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    .barra .btn { padding: 13px 18px; font-size: 15px; border-radius: 12px; }

    /* Teclado numérico */
    .teclado-fondo { position: fixed; inset: 0; z-index: 600; background: var(--velo); display: none; align-items: flex-end; justify-content: center; }
    .teclado-fondo.visible { display: flex; animation: aparecer .18s ease-out; }
    .teclado { width: 100%; max-width: 480px; background: var(--superficie); border-radius: 22px 22px 0 0; padding: 18px 16px calc(22px + env(safe-area-inset-bottom)); animation: hojaTeclado .26s cubic-bezier(.2, .8, .2, 1); }
    @keyframes hojaTeclado { from { transform: translateY(100%); } }
    .teclado-titulo { font-weight: 700; font-size: 16px; }
    .teclado-sub { font-size: 13px; color: var(--tenue); margin-bottom: 12px; }
    .teclado-pantalla { background: var(--superficie-2); border-radius: 14px; height: 72px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
    .teclado-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tecla { height: 58px; border: 0; border-radius: 14px; background: var(--superficie-2); font-size: 22px; font-weight: 600; }
    .tecla:active { transform: scale(.96); background: var(--superficie-3); }
    .tecla.ok { background: var(--acento); color: var(--acento-texto); font-size: 17px; }

    /* Revisión */
    .resumen-fecha { font-size: 15px; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--acento-suave); }
    .resumen-fecha .ico { color: var(--acento-tinta); }
    .resumen-suc { font-size: 12px; font-weight: 700; color: var(--tenue); text-transform: uppercase; letter-spacing: .06em; margin-top: 16px; }
    .resumen-linea { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid var(--borde); font-size: 14px; }
    .resumen-linea .calc { grid-column: 1; font-size: 13px; color: var(--tenue); }
    .resumen-linea .imp { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-weight: 700; font-variant-numeric: tabular-nums; }
    .resumen-notas { font-size: 14px; color: var(--tenue); margin-top: 12px; white-space: pre-wrap; }
    .resumen-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; padding-top: 12px; border-top: 2px solid var(--texto); font-weight: 800; font-size: 21px; font-variant-numeric: tabular-nums; }
    .resumen-total small { font-size: 12px; font-weight: 500; color: var(--tenue); }

    /* Historial */
    .cajon-fondo { position: fixed; inset: 0; z-index: 250; background: var(--velo); display: none; align-items: flex-end; justify-content: center; }
    .cajon-fondo.visible { display: flex; animation: aparecer .18s ease-out; }
    .cajon { width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; background: var(--fondo); border-radius: 22px 22px 0 0; padding: 18px 16px calc(32px + env(safe-area-inset-bottom)); animation: hojaTeclado .28s cubic-bezier(.2, .8, .2, 1); }
    .cajon-cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .cajon-cab h2 { font-size: 20px; letter-spacing: -.01em; }
    .historial .tarjeta { padding: 16px; margin-bottom: 12px; }
    .tarjeta-cab { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
    .tarjeta-fecha { font-weight: 700; }
    .tarjeta-sub { font-size: 12px; color: var(--tenue); }
    .tarjeta-suc { font-size: 12px; font-weight: 700; color: var(--tenue); text-transform: uppercase; letter-spacing: .06em; margin-top: 8px; }
    .tarjeta-linea { font-size: 14px; display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
    .tarjeta-linea strong { font-variant-numeric: tabular-nums; font-weight: 600; }
    .tarjeta-total { display: flex; justify-content: space-between; font-weight: 800; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--borde); font-variant-numeric: tabular-nums; }
    .tarjeta-notas { font-size: 13px; color: var(--tenue); margin-top: 8px; }
    .tarjeta-acciones { margin-top: 12px; display: flex; justify-content: flex-end; }

    .exito { text-align: center; }
    .exito-icono { width: 64px; height: 64px; border-radius: 50%; background: var(--exito-suave); color: var(--exito); display: flex; align-items: center; justify-content: center; margin: 4px auto 14px; }
    .exito-icono .ico { width: 32px; height: 32px; stroke-width: 2.5; }
    .exito p { color: var(--tenue); margin-bottom: 18px; }
    .modal .btn.ancho { width: 100%; padding: 13px; margin-top: 8px; font-size: 15px; }
    .btn.whatsapp { background: #1f8f4e; border-color: #1f8f4e; color: #fff; }
    .btn.whatsapp:hover { background: #1a7a43; }
  </style>
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-interior">
      <div class="cabecera-fila">
        <div class="marca"><div class="marca-logo" data-marca-logo></div><div class="negocio marca-nombre" id="negocio" data-marca-nombre>PROVEEDOR</div></div>
        <button class="btn chico" id="btnHistorial" hidden><svg class="ico" aria-hidden="true"><use href="iconos.svg#reloj"/></svg>Mis pedidos</button>
      </div>
      <div class="saludo" id="saludo" hidden><small>Pedido para</small><div class="cliente-nombre" id="clienteNombre"></div></div>
      <nav class="chips" id="chips" hidden aria-label="Ir a"></nav>
    </div>
  </header>

  <main class="contenido" id="contenido">
    <div class="estado-pantalla"><div class="spinner"></div><p>Cargando…</p></div>
  </main>
  <div class="relleno-inferior"></div>

  <div class="barra" id="barra">
    <div class="barra-interior">
      <div class="barra-info"><span id="barraDetalle"></span><strong id="barraTotal"></strong></div>
      <button class="btn primario" id="btnRevisar">Revisar pedido<svg class="ico" aria-hidden="true"><use href="iconos.svg#derecha"/></svg></button>
    </div>
  </div>

  <!-- Teclado numérico -->
  <div class="teclado-fondo" id="tecladoFondo">
    <div class="teclado" role="dialog" aria-label="Escribir cantidad">
      <div class="teclado-titulo" id="tecladoTitulo"></div>
      <div class="teclado-sub" id="tecladoSub"></div>
      <div class="teclado-pantalla" id="tecladoPantalla">0</div>
      <div class="teclado-grid" id="tecladoGrid">
        <button class="tecla" data-k="7">7</button><button class="tecla" data-k="8">8</button><button class="tecla" data-k="9">9</button>
        <button class="tecla" data-k="4">4</button><button class="tecla" data-k="5">5</button><button class="tecla" data-k="6">6</button>
        <button class="tecla" data-k="1">1</button><button class="tecla" data-k="2">2</button><button class="tecla" data-k="3">3</button>
        <button class="tecla" data-k="borrar" aria-label="Borrar">⌫</button><button class="tecla" data-k="0">0</button><button class="tecla ok" data-k="ok">Listo</button>
      </div>
    </div>
  </div>

  <!-- Otra fecha -->
  <div class="modal-fondo" id="modalCalendario">
    <div class="modal">
      <h2>Elige otra fecha</h2>
      <div id="calendario"></div>
      <div class="modal-acciones"><button class="btn" data-cerrar="modalCalendario">Cerrar</button></div>
    </div>
  </div>

  <!-- Revisar pedido -->
  <div class="modal-fondo" id="modalRevision">
    <div class="modal">
      <h2>Revisa tu pedido</h2>
      <div id="revisionContenido"></div>
      <button class="btn primario ancho" id="btnConfirmar">Confirmar pedido</button>
      <button class="btn ancho" data-cerrar="modalRevision">Corregir</button>
    </div>
  </div>

  <!-- Éxito -->
  <div class="modal-fondo" id="modalExito">
    <div class="modal exito">
      <div class="exito-icono"><svg class="ico" aria-hidden="true"><use href="iconos.svg#check"/></svg></div>
      <h2 id="exitoTitulo">¡Pedido enviado!</h2>
      <p id="exitoTexto"></p>
      <button class="btn whatsapp ancho" id="btnWhatsApp">Avisar por WhatsApp</button>
      <button class="btn ancho" data-cerrar="modalExito">Cerrar</button>
    </div>
  </div>

  <div class="cajon-fondo" id="historialFondo">
    <div class="cajon">
      <div class="cajon-cab"><h2>Mis pedidos</h2><button class="btn chico" id="btnCerrarHistorial">Cerrar</button></div>
      <div id="historialContenido" class="historial"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="comun.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get('c');
    const db = conectarSupabase();
    const DIAS_EN_TIRA = 14;

    let datos = null;            // respuesta de cliente_por_token
    let sucursales = [];         // [{id, nombre}] o [{id: null, nombre: ''}] si no tiene
    let pedidos = [];            // pedidos recientes del cliente
    let cantidades = {};         // { 'iSucursal:iProducto': número }
    let fechaElegida = null;
    let mesVisible = null;       // 'AAAA-MM' del calendario
    let ultimoPedido = null;

    const $ = (id) => document.getElementById(id);
    const tienePrecio = (p) => Number(p.precio) > 0;

    document.querySelectorAll('[data-cerrar]').forEach((b) => (b.onclick = () => $(b.dataset.cerrar).classList.remove('visible')));

    function pantallaEstado(titulo, texto, ico = 'alerta') {
      $('contenido').innerHTML = `<div class="estado-pantalla"><div class="vacio-icono">${icono(ico, 'grande')}</div><h2>${esc(titulo)}</h2><p>${esc(texto)}</p></div>`;
    }

    async function iniciar() {
      if (!db) return pantallaEstado('Falta configurar', 'El sistema aún no está conectado a la base de datos.');
      if (!token) return pantallaEstado('Link incompleto', 'Pide a tu proveedor el link para hacer pedidos.', 'enlace');

      const { data, error } = await db.rpc('cliente_por_token', { p_token: token });
      if (error) return pantallaEstado('No se pudo cargar', mensajeError(error));
      if (!data) return pantallaEstado('Link no válido', 'Este link ya no funciona. Pide uno nuevo a tu proveedor.', 'enlace');

      datos = data;
      sucursales = data.sucursales.length ? data.sucursales : [{ id: null, nombre: '' }];
      aplicarMarca({ color: data.negocio.color, logo: data.negocio.logo, nombre: data.negocio.nombre });
      $('clienteNombre').textContent = data.cliente.nombre;
      $('saludo').hidden = false;
      document.title = `Pedidos · ${data.cliente.nombre}`;
      $('btnHistorial').hidden = false;
      mesVisible = data.fecha_minima.slice(0, 7);

      if (!data.productos.length) {
        return pantallaEstado('Sin productos', 'Tu proveedor todavía no te ha asignado productos.', 'paquete');
      }
      await cargarPedidos();
      dibujar();
    }

    async function cargarPedidos() {
      const { data } = await db.rpc('pedidos_por_token', { p_token: token });
      pedidos = data || [];
    }

    const pedidoDelDia = (fecha) => pedidos.find((p) => p.fecha_entrega === fecha && p.estado !== 'cancelado');

    function dibujar() {
      const porCategoria = {};
      datos.productos.forEach((p, i) => (porCategoria[p.categoria] ||= []).push([p, i]));

      const bloques = sucursales.map((s, si) => `
        <section class="sucursal" id="suc-${si}">
          ${s.nombre ? `<div class="sucursal-cab"><h3>${icono('ubicacion')}${esc(s.nombre)}</h3><span class="etiqueta sin-punto" id="total-${si}">0</span></div>` : ''}
          ${Object.entries(porCategoria).map(([cat, lista], ci) => `
            <div class="grupo-cat" id="cat-${si}-${ci}">
            <div class="categoria">${esc(cat)}</div>
            ${lista.map(([p, pi]) => `
              <div class="producto" id="fila-${si}-${pi}">
                <div class="producto-info">
                  <div class="producto-nombre">${esc(p.nombre)}</div>
                  <div class="producto-pres">${esc(textoPresentacion(p))}</div>
                  ${tienePrecio(p)
                    ? `<div class="producto-precio">${esc(dinero(p.precio))}<span class="sub" id="sub-${si}-${pi}"></span></div>`
                    : '<div class="producto-precio sin-precio">Precio por confirmar</div>'}
                </div>
                <div class="cantidad">
                  <button data-clave="${si}:${pi}" data-paso="-1" aria-label="Menos" ${tienePrecio(p) ? '' : 'disabled'}>−</button>
                  <button class="num" id="num-${si}-${pi}" data-clave="${si}:${pi}" aria-label="Escribir cantidad" ${tienePrecio(p) ? '' : 'disabled'}>0</button>
                  <button data-clave="${si}:${pi}" data-paso="1" aria-label="Más" ${tienePrecio(p) ? '' : 'disabled'}>+</button>
                </div>
              </div>`).join('')}
            </div>
          `).join('')}
        </section>`).join('');

      $('contenido').innerHTML = `
        <div class="titulo-seccion"><h2><span class="n">1</span>Fecha de entrega</h2>
          <button class="btn chico" id="btnOtraFecha">${icono('calendario')}Otra fecha</button></div>
        <div class="tira-dias" id="tiraDias"></div>
        <div class="fecha-elegida" id="fechaElegida">Elige el día en que quieres recibir tu pedido</div>
        <div id="avisoDia"></div>
        <div id="formulario" class="bloqueado">
          <div class="titulo-seccion"><h2><span class="n">2</span>Productos <small>${esc(datos.productos.length)}</small></h2></div>
          ${bloques}
          <div class="titulo-seccion"><h2><span class="n">3</span>Notas <small>opcional</small></h2></div>
          <textarea class="notas" id="notas" maxlength="500" placeholder="Indicaciones para la entrega, cambios, etc."></textarea>
        </div>`;

      // Atajos: por sucursal si hay varias; si no, por categoría
      const atajos = sucursales.length > 1
        ? sucursales.map((s, si) => [`suc-${si}`, s.nombre])
        : Object.keys(porCategoria).map((cat, ci) => [`cat-0-${ci}`, cat]);
      $('chips').hidden = atajos.length < 2;
      $('chips').innerHTML = atajos.map(([id, txt]) => `<button data-ir="${esc(id)}">${esc(txt)}</button>`).join('');
      $('chips').onclick = (e) => {
        const b = e.target.closest('button[data-ir]');
        if (b) document.getElementById(b.dataset.ir)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      $('formulario').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-clave]');
        if (!b || b.disabled) return;
        if (b.dataset.paso) cambiar(b.dataset.clave, Number(b.dataset.paso));
        else abrirTeclado(b.dataset.clave);
      });
      $('btnOtraFecha').onclick = () => {
        if (fechaElegida) mesVisible = fechaElegida.slice(0, 7);
        dibujarCalendario();
        $('modalCalendario').classList.add('visible');
      };
      dibujarTira();
    }

    // ─────────── Tira de días ───────────
    function dibujarTira() {
      const fechas = Array.from({ length: DIAS_EN_TIRA }, (_, i) => sumarDias(datos.fecha_minima, i));
      if (fechaElegida && !fechas.includes(fechaElegida)) fechas.push(fechaElegida);
      $('tiraDias').innerHTML = fechas.map((f) => {
        const d = new Date(f + 'T12:00:00Z');
        const sem = d.toLocaleDateString('es-MX', { weekday: 'short', timeZone: 'UTC' }).replace('.', '');
        const mes = d.toLocaleDateString('es-MX', { month: 'short', timeZone: 'UTC' }).replace('.', '');
        const clases = [pedidoDelDia(f) ? 'con-pedido' : '', f === fechaElegida ? 'seleccionado' : ''].join(' ');
        return `<button class="${clases}" data-fecha="${f}" aria-label="${esc(fechaLarga(f))}">
          <span class="dia-sem">${esc(sem)}</span><span class="dia-num">${d.getUTCDate()}</span><span class="dia-mes">${esc(mes)}</span></button>`;
      }).join('');
      $('tiraDias').querySelectorAll('button').forEach((b) => (b.onclick = () => elegirFecha(b.dataset.fecha)));
      $('tiraDias').querySelector('.seleccionado')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    // ─────────── Calendario (otra fecha) ───────────
    function dibujarCalendario() {
      const min = datos.fecha_minima;
      const max = sumarDias(min, 90);
      const [anio, mes] = mesVisible.split('-').map(Number);
      const primerDia = new Date(Date.UTC(anio, mes - 1, 1));
      const diasMes = new Date(Date.UTC(anio, mes, 0)).getUTCDate();
      const desfase = (primerDia.getUTCDay() + 6) % 7;   // semana inicia en lunes
      const nombreMes = primerDia.toLocaleDateString('es-MX', { month: 'long', year: 'numeric', timeZone: 'UTC' });

      let celdas = '<div></div>'.repeat(desfase);
      for (let d = 1; d <= diasMes; d++) {
        const f = `${mesVisible}-${String(d).padStart(2, '0')}`;
        const habilitado = f >= min && f <= max;
        const clases = ['cal-dia', habilitado ? 'disponible' : '', pedidoDelDia(f) ? 'con-pedido' : '', f === fechaElegida ? 'seleccionado' : ''].join(' ');
        celdas += `<button class="${clases}" data-fecha="${f}" ${habilitado ? '' : 'disabled'}>${d}</button>`;
      }

      $('calendario').innerHTML = `
        <div class="cal-cab">
          <button class="cal-nav" id="mesAnterior" aria-label="Mes anterior" ${mesVisible <= min.slice(0, 7) ? 'disabled' : ''}>‹</button>
          <div class="cal-mes">${esc(nombreMes)}</div>
          <button class="cal-nav" id="mesSiguiente" aria-label="Mes siguiente" ${mesVisible >= max.slice(0, 7) ? 'disabled' : ''}>›</button>
        </div>
        <div class="cal-semana"><div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div></div>
        <div class="cal-grid">${celdas}</div>`;

      $('mesAnterior').onclick = () => moverMes(-1);
      $('mesSiguiente').onclick = () => moverMes(1);
      $('calendario').querySelectorAll('.cal-dia:not(:disabled)').forEach((b) => (b.onclick = () => {
        $('modalCalendario').classList.remove('visible');
        elegirFecha(b.dataset.fecha);
      }));
    }

    function moverMes(n) {
      const [a, m] = mesVisible.split('-').map(Number);
      mesVisible = new Date(Date.UTC(a, m - 1 + n, 1)).toISOString().slice(0, 7);
      dibujarCalendario();
    }

    function elegirFecha(fecha) {
      fechaElegida = fecha;
      dibujarTira();
      $('fechaElegida').innerHTML = `${icono('camion', 'chico')}Entrega: <strong>${esc(fechaLarga(fecha))}</strong>`;
      const existente = pedidoDelDia(fecha);
      if (existente) {
        $('avisoDia').innerHTML = `<div class="aviso">Ya tienes el pedido <strong>#${esc(existente.folio)}</strong> para este día.<br>
          <button class="btn chico" id="verPedido">${icono('reloj')}Ver mis pedidos</button></div>`;
        $('verPedido').onclick = abrirHistorial;
        $('formulario').classList.add('bloqueado');
      } else {
        $('avisoDia').innerHTML = '';
        $('formulario').classList.remove('bloqueado');
      }
      actualizarBarra();
    }

    // ─────────── Cantidades ───────────
    function cambiar(clave, paso) {
      fijarCantidad(clave, (cantidades[clave] || 0) + paso);
    }

    function fijarCantidad(clave, valor) {
      cantidades[clave] = Math.max(0, Math.min(999, valor || 0));
      const [si, pi] = clave.split(':');
      const el = $(`num-${si}-${pi}`);
      el.textContent = cantidades[clave];
      el.classList.toggle('activo', cantidades[clave] > 0);
      $(`fila-${si}-${pi}`)?.classList.toggle('con-cantidad', cantidades[clave] > 0);
      const sub = $(`sub-${si}-${pi}`);
      if (sub) sub.textContent = cantidades[clave] > 0 ? `× ${cantidades[clave]} = ${dinero(cantidades[clave] * datos.productos[pi].precio)}` : '';
      const totalSuc = $(`total-${si}`);
      if (totalSuc) {
        totalSuc.textContent = Object.entries(cantidades).filter(([k, v]) => k.startsWith(`${si}:`) && v > 0).length;
      }
      actualizarBarra();
    }

    /** Líneas con cantidad > 0, con todo lo necesario para mostrar y enviar. */
    function lineasDelPedido() {
      return Object.entries(cantidades)
        .filter(([, v]) => v > 0)
        .map(([clave, cantidad]) => {
          const [si, pi] = clave.split(':').map(Number);
          const producto = datos.productos[pi];
          return { sucursal: sucursales[si], producto, cantidad, importe: cantidad * Number(producto.precio) };
        });
    }

    const totalDe = (lineas) => lineas.reduce((a, l) => a + l.importe, 0);

    function actualizarBarra() {
      const lineas = lineasDelPedido();
      const visible = lineas.length > 0 && fechaElegida && !pedidoDelDia(fechaElegida);
      $('barra').classList.toggle('visible', !!visible);
      if (visible) {
        $('barraDetalle').textContent = `${fechaCorta(fechaElegida)} · ${lineas.length} ${lineas.length === 1 ? 'producto' : 'productos'}`;
        $('barraTotal').textContent = dinero(totalDe(lineas));
      }
    }

    // ─────────── Teclado numérico ───────────
    let claveTeclado = null, valorTeclado = '';
    function abrirTeclado(clave) {
      claveTeclado = clave;
      valorTeclado = cantidades[clave] ? String(cantidades[clave]) : '';
      const [si, pi] = clave.split(':').map(Number);
      const p = datos.productos[pi];
      $('tecladoTitulo').textContent = p.nombre;
      $('tecladoSub').textContent = [sucursales[si].nombre, textoPresentacion(p), dinero(p.precio)].filter(Boolean).join(' · ');
      $('tecladoPantalla').textContent = valorTeclado || '0';
      $('tecladoFondo').classList.add('visible');
    }
    $('tecladoGrid').addEventListener('click', (e) => {
      const k = e.target.closest('.tecla')?.dataset.k;
      if (!k) return;
      if (k === 'ok') {
        fijarCantidad(claveTeclado, parseInt(valorTeclado, 10) || 0);
        $('tecladoFondo').classList.remove('visible');
        return;
      }
      if (k === 'borrar') valorTeclado = valorTeclado.slice(0, -1);
      else if (valorTeclado.length < 3) valorTeclado = (valorTeclado + k).replace(/^0+(?=\d)/, '');
      $('tecladoPantalla').textContent = valorTeclado || '0';
    });
    $('tecladoFondo').addEventListener('click', (e) => {
      if (e.target.id === 'tecladoFondo') $('tecladoFondo').classList.remove('visible');
    });

    // ─────────── Revisar y confirmar ───────────
    function htmlLineas(lineas) {
      return sucursales.map((s) => {
        const ls = lineas.filter((l) => l.sucursal === s);
        if (!ls.length) return '';
        return `${s.nombre ? `<div class="resumen-suc">${esc(s.nombre)}</div>` : ''}
          ${ls.map((l) => `
            <div class="resumen-linea">
              <span>${esc(l.producto.nombre)} <span class="tarjeta-sub">${esc(l.producto.presentacion)}</span></span>
              <span class="calc">${esc(l.cantidad)} × ${esc(dinero(l.producto.precio))}</span>
              <span class="imp">${esc(dinero(l.importe))}</span>
            </div>`).join('')}`;
      }).join('');
    }

    $('btnRevisar').onclick = () => {
      const lineas = lineasDelPedido();
      if (!fechaElegida || !lineas.length) return;
      const notas = $('notas').value.trim();
      $('revisionContenido').innerHTML = `
        <div class="resumen-fecha">${icono('camion')}<span>Entrega: <strong>${esc(fechaLarga(fechaElegida))}</strong></span></div>
        ${htmlLineas(lineas)}
        ${notas ? `<div class="resumen-notas">Notas: ${esc(notas)}</div>` : ''}
        <div class="resumen-total"><span>Total <small>IVA incluido</small></span><span>${esc(dinero(totalDe(lineas)))}</span></div>`;
      $('modalRevision').classList.add('visible');
    };

    $('btnConfirmar').onclick = async () => {
      const lineas = lineasDelPedido();
      const btn = $('btnConfirmar');
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      const notas = $('notas').value.trim();
      const { data, error } = await db.rpc('crear_pedido', {
        p_token: token,
        p_fecha_entrega: fechaElegida,
        p_lineas: lineas.map((l) => ({ sucursal_id: l.sucursal.id, producto_id: l.producto.id, cantidad: l.cantidad })),
        p_notas: notas,
      });
      btn.disabled = false;
      btn.textContent = 'Confirmar pedido';
      if (error) return mostrarToast(mensajeError(error), 'error');

      ultimoPedido = { folio: data.folio, fecha: fechaElegida, lineas, notas, total: Number(data.total) };
      $('modalRevision').classList.remove('visible');
      $('exitoTitulo').textContent = `¡Pedido #${data.folio} enviado!`;
      $('exitoTexto').textContent = `Total ${dinero(data.total)}. Lo recibirás el ${fechaLarga(fechaElegida).toLowerCase()}. Te avisaremos cuando lo confirmemos.`;
      $('modalExito').classList.add('visible');

      await cargarPedidos();
      Object.keys(cantidades).forEach((k) => fijarCantidad(k, 0));
      $('notas').value = '';
      elegirFecha(fechaElegida);
    };

    $('btnWhatsApp').onclick = () => {
      if (!ultimoPedido) return;
      let msg = `*Pedido #${ultimoPedido.folio}*\n${datos.cliente.nombre}\nEntrega: ${fechaLarga(ultimoPedido.fecha, true)}\n`;
      sucursales.forEach((s) => {
        const items = ultimoPedido.lineas.filter((l) => l.sucursal === s);
        if (!items.length) return;
        msg += s.nombre ? `\n*${s.nombre}*\n` : '\n';
        items.forEach((l) => {
          const p = l.producto;
          msg += `• ${p.nombre}${p.presentacion ? ` (${p.presentacion})` : ''}: *${l.cantidad}* × ${dinero(p.precio)} = ${dinero(l.importe)}\n`;
        });
      });
      msg += `\n*Total: ${dinero(ultimoPedido.total)}*`;
      if (ultimoPedido.notas) msg += `\nNotas: ${ultimoPedido.notas}`;
      const numero = datos.negocio.whatsapp || '';
      window.open(`https://wa.me/${numero}?text=${encodeURIComponent(msg)}`, '_blank');
    };

    // ─────────── Historial ───────────
    async function abrirHistorial() {
      $('historialFondo').classList.add('visible');
      $('historialContenido').innerHTML = esqueleto(4, 22);
      await cargarPedidos();
      if (!pedidos.length) {
        $('historialContenido').innerHTML = estadoVacio('bandeja', 'Aún no tienes pedidos recientes');
        return;
      }
      $('historialContenido').innerHTML = pedidos.map((p) => {
        const porSuc = {};
        p.lineas.forEach((l) => (porSuc[l.sucursal] ||= []).push(l));
        return `
          <div class="tarjeta">
            <div class="tarjeta-cab">
              <div>
                <div class="tarjeta-fecha">${esc(fechaLarga(p.fecha_entrega))}</div>
                <div class="tarjeta-sub">Pedido #${esc(p.folio)}</div>
              </div>
              <span class="etiqueta ${esc(p.estado)}">${esc(ESTADOS[p.estado] || p.estado)}</span>
            </div>
            ${Object.entries(porSuc).map(([suc, ls]) => `
              ${suc ? `<div class="tarjeta-suc">${esc(suc)}</div>` : ''}
              ${ls.map((l) => `<div class="tarjeta-linea"><span>${esc(l.cantidad)} × ${esc(l.producto)} <span class="tarjeta-sub">${esc(l.presentacion)}</span></span>
                <strong>${l.importe != null ? esc(dinero(l.importe)) : ''}</strong></div>`).join('')}
            `).join('')}
            ${p.total != null ? `<div class="tarjeta-total"><span>Total</span><span>${esc(dinero(p.total))}</span></div>` : ''}
            ${p.notas ? `<div class="tarjeta-notas">${esc(p.notas)}</div>` : ''}
            <div class="tarjeta-acciones"><a class="btn chico" target="_blank" rel="noopener"
              href="remision.html?t=${encodeURIComponent(token)}&folio=${encodeURIComponent(p.folio)}">${icono('documento')}Descargar nota</a></div>
          </div>`;
      }).join('');
    }
    $('btnHistorial').onclick = abrirHistorial;
    $('btnCerrarHistorial').onclick = () => $('historialFondo').classList.remove('visible');
    $('historialFondo').addEventListener('click', (e) => {
      if (e.target.id === 'historialFondo') $('historialFondo').classList.remove('visible');
    });

    iniciar();
  </script>
</body>
</html>
