<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remisión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="base.css" />
  <style>
    /* La hoja siempre es papel blanco, también en modo oscuro */
    body { background: var(--fondo); }
    .barra-herramientas {
      position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--superficie) 90%, transparent);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--borde);
    }
    .barra-herramientas .interior { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .barra-herramientas .titulo { flex: 1; min-width: 0; font-weight: 600; }
    .barra-herramientas .titulo small { display: block; color: var(--tenue); font-weight: 400; font-size: 12px; }
    .hojas { padding: 24px 16px 48px; display: grid; gap: 24px; justify-content: center; }
    .estado { max-width: 480px; margin: 80px auto; text-align: center; color: var(--tenue); }

    .hoja {
      --tinta: #0f172a; --gris: #5b6577; --linea: #dfe4ea; --fondo-tabla: #f3f5f8;
      width: 216mm; max-width: 100%; min-height: 279mm; background: #fff; color: var(--tinta);
      padding: 16mm 15mm 14mm; box-shadow: var(--sombra-3); border-radius: 4px; display: flex; flex-direction: column;
      font-size: 12.5px; line-height: 1.45;
    }
    .hoja-cab { display: flex; justify-content: space-between; gap: 24px; padding-bottom: 14px; border-bottom: 3px solid var(--acento); }
    .emisor { display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
    .emisor .marca-logo { width: 58px; height: 58px; border-radius: 10px; }
    .emisor .monograma { font-size: 18px; }
    .emisor h1 { font-size: 18px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
    .emisor div div { color: var(--gris); font-size: 11.5px; }
    .doc { text-align: right; flex-shrink: 0; }
    .doc .tipo { font-size: 12px; font-weight: 800; letter-spacing: .18em; color: var(--acento); }
    .doc .folio { font-size: 22px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
    .doc dl { display: grid; grid-template-columns: auto auto; gap: 2px 10px; margin-top: 6px; font-size: 11.5px; justify-content: end; }
    .doc dt { color: var(--gris); }
    .doc dd { font-weight: 600; text-align: right; }

    .receptor { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin: 16px 0; }
    .caja { border: 1px solid var(--linea); border-radius: 8px; padding: 10px 12px; }
    .caja .rotulo { font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--gris); text-transform: uppercase; margin-bottom: 3px; }
    .caja .nombre { font-size: 15px; font-weight: 700; }
    .caja .dato { color: var(--gris); }

    .hoja table { font-size: 12px; border: 1px solid var(--linea); border-radius: 8px; overflow: hidden; }
    .hoja th { background: var(--fondo-tabla); color: var(--gris); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding: 7px 10px; position: static; border-bottom: 1px solid var(--linea); }
    .hoja td { padding: 7px 10px; border-bottom: 1px solid var(--linea); color: var(--tinta); }
    .hoja tbody tr:hover td { background: transparent; }
    .hoja td.num, .hoja th.num { text-align: right; }
    .hoja td.cant { text-align: center; font-weight: 700; width: 54px; }
    .hoja tr.suc td { background: #fafbfc; font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--gris); }
    .hoja tr.subtotal td { font-weight: 600; color: var(--gris); background: #fafbfc; }
    .hoja td small { color: var(--gris); }

    .totales { display: flex; justify-content: space-between; gap: 20px; margin-top: 14px; align-items: flex-start; }
    .letra { flex: 1; font-size: 11.5px; color: var(--gris); }
    .letra strong { display: block; color: var(--tinta); font-size: 12px; }
    .total-caja { min-width: 210px; border-radius: 8px; background: var(--fondo-tabla); padding: 10px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .total-caja span { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--gris); }
    .total-caja strong { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .notas { margin-top: 12px; font-size: 11.5px; border-left: 3px solid var(--linea); padding: 4px 10px; color: var(--gris); white-space: pre-wrap; }

    .pie { margin-top: auto; padding-top: 22px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
    .firma { border-top: 1px solid var(--tinta); padding-top: 5px; font-size: 10.5px; color: var(--gris); text-align: center; margin-top: 34px; }
    .recibi { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--gris); text-transform: uppercase; margin-bottom: -26px; }
    .leyenda { grid-column: 1 / -1; font-size: 10.5px; color: var(--gris); text-align: center; border-top: 1px solid var(--linea); padding-top: 8px; margin-top: 6px; }

    @page { size: letter; margin: 0; }
    @media print {
      html, body { background: #fff !important; }
      .hojas { padding: 0; gap: 0; display: block; }
      .hoja { width: 216mm; min-height: 279mm; height: 279mm; box-shadow: none; border-radius: 0; break-after: page; overflow: hidden; }
      .hoja:last-child { break-after: auto; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    @media (max-width: 860px) {
      .hoja { padding: 22px 18px; min-height: 0; font-size: 12px; }
      .hoja-cab, .receptor, .totales { flex-direction: column; display: flex; }
      .doc { text-align: left; }
      .doc dl { justify-content: start; }
      .pie { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="barra-herramientas no-imprimir">
    <div class="interior">
      <div class="titulo" id="titulo">Remisión<small id="subtitulo">Cargando…</small></div>
      <button class="btn" id="btnCerrar" type="button">Cerrar</button>
      <button class="btn primario" id="btnImprimir" type="button" disabled>
        <svg class="ico" aria-hidden="true"><use href="iconos.svg#imprimir"/></svg>Imprimir / Guardar PDF</button>
    </div>
  </div>
  <main class="hojas" id="hojas"><div class="estado"><div class="spinner" style="margin:0 auto 12px"></div>Cargando…</div></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="comun.js"></script>
  <script>
    const db = conectarSupabase();
    const $ = (id) => document.getElementById(id);
    const q = new URLSearchParams(location.search);

    $('btnImprimir').onclick = () => window.print();
    $('btnCerrar').onclick = () => (history.length > 1 ? history.back() : window.close());

    function error(titulo, texto) {
      $('subtitulo').textContent = titulo;
      $('hojas').innerHTML = `<div class="estado">${estadoVacio('alerta', titulo, texto)}</div>`;
    }

    /** Normaliza un pedido (del panel o del link del cliente) a lo que necesita la hoja. */
    function hoja(negocio, cliente, pedido) {
      const lineas = [...pedido.lineas].sort((a, b) =>
        (a.sucursal || '').localeCompare(b.sucursal || '') || a.producto.localeCompare(b.producto));
      const sucursales = [...new Set(lineas.map((l) => l.sucursal || ''))];
      const varias = sucursales.length > 1 || (sucursales[0] || '') !== '';
      const total = lineas.reduce((a, l) => a + Number(l.importe || 0), 0);
      const fila = (l) => `<tr>
        <td class="cant">${esc(l.cantidad)}</td>
        <td>${esc(UNIDADES[l.unidad] || l.unidad || '')}</td>
        <td><strong>${esc(l.producto)}</strong>${l.presentacion ? ` <small>· ${esc(l.presentacion)}</small>` : ''}</td>
        <td class="num">${l.precio_unitario != null ? esc(dinero(l.precio_unitario)) : '—'}</td>
        <td class="num">${l.importe != null ? esc(dinero(l.importe)) : '—'}</td></tr>`;
      const cuerpo = sucursales.map((s) => {
        const ls = lineas.filter((l) => (l.sucursal || '') === s);
        const sub = ls.reduce((a, l) => a + Number(l.importe || 0), 0);
        return `${varias ? `<tr class="suc"><td colspan="5">${esc(s || 'Sin sucursal')}</td></tr>` : ''}
          ${ls.map(fila).join('')}
          ${sucursales.length > 1 ? `<tr class="subtotal"><td colspan="4" class="num">Subtotal ${esc(s)}</td><td class="num">${esc(dinero(sub))}</td></tr>` : ''}`;
      }).join('');
      const emisor = [negocio.razon_social, negocio.rfc ? `RFC ${negocio.rfc}` : '', negocio.direccion, negocio.telefono ? `Tel. ${negocio.telefono}` : '']
        .filter(Boolean).map((t) => `<div>${esc(t)}</div>`).join('');
      const creado = pedido.creado ? new Date(pedido.creado).toLocaleDateString('es-MX', { timeZone: ZONA_HORARIA, day: 'numeric', month: 'short', year: 'numeric' }) : '';

      return `<article class="hoja">
        <header class="hoja-cab">
          <div class="emisor">
            <div class="marca-logo" data-marca-logo></div>
            <div><h1>${esc(negocio.nombre)}</h1>${emisor}</div>
          </div>
          <div class="doc">
            <div class="tipo">REMISIÓN</div>
            <div class="folio">${esc(folioRemision(pedido.folio))}</div>
            <dl>
              <dt>Entrega</dt><dd>${esc(fechaLarga(pedido.fecha_entrega, true))}</dd>
              ${creado ? `<dt>Pedido</dt><dd>${esc(creado)}</dd>` : ''}
              <dt>Estado</dt><dd>${esc(ESTADOS[pedido.estado] || pedido.estado)}</dd>
            </dl>
          </div>
        </header>
        <section class="receptor">
          <div class="caja">
            <div class="rotulo">Cliente</div>
            <div class="nombre">${esc(cliente.nombre)}</div>
            ${cliente.direccion ? `<div class="dato">${esc(cliente.direccion)}</div>` : ''}
            ${cliente.telefono ? `<div class="dato">Tel. ${esc(cliente.telefono)}</div>` : ''}
          </div>
          <div class="caja">
            <div class="rotulo">Entrega</div>
            <div class="dato"><strong style="color:var(--tinta)">${esc(fechaLarga(pedido.fecha_entrega))}</strong></div>
            ${cliente.horario_recepcion ? `<div class="dato">Horario: ${esc(cliente.horario_recepcion)}</div>` : ''}
            ${cliente.instrucciones ? `<div class="dato">${esc(cliente.instrucciones)}</div>` : ''}
          </div>
        </section>
        <table>
          <thead><tr><th class="num" style="text-align:center">Cant.</th><th>Unidad</th><th>Producto</th><th class="num">P. unitario</th><th class="num">Importe</th></tr></thead>
          <tbody>${cuerpo}</tbody>
        </table>
        <section class="totales">
          <div class="letra"><strong>Importe con letra</strong>${esc(numeroALetras(total))}</div>
          <div class="total-caja"><span>TOTAL</span><strong>${esc(dinero(total))}</strong></div>
        </section>
        ${pedido.notas ? `<div class="notas"><strong>Notas:</strong> ${esc(pedido.notas)}</div>` : ''}
        <footer class="pie">
          <div class="recibi">Recibí de conformidad</div>
          <div class="firma">Nombre</div><div class="firma">Firma</div><div class="firma">Fecha y hora</div>
          ${negocio.leyenda_remision ? `<div class="leyenda">${esc(negocio.leyenda_remision)}</div>` : ''}
        </footer>
      </article>`;
    }

    function mostrar(negocio, hojas, titulo) {
      aplicarMarca({ color: negocio.color, logo: negocio.logo, nombre: negocio.nombre });
      $('hojas').innerHTML = hojas.join('');
      aplicarMarca({ color: negocio.color, logo: negocio.logo, nombre: negocio.nombre });   // logos dentro de las hojas
      $('titulo').firstChild.textContent = titulo;
      $('subtitulo').textContent = hojas.length === 1 ? 'Lista para imprimir o guardar como PDF' : `${hojas.length} remisiones, una por página`;
      document.title = titulo;
      $('btnImprimir').disabled = false;
    }

    const lineaPanel = (l) => ({
      sucursal: l.sucursal_nombre, producto: l.producto_nombre, presentacion: l.presentacion, unidad: l.unidad,
      cantidad: l.cantidad, precio_unitario: l.precio_unitario, importe: l.importe,
    });

    async function desdePanel() {
      const { data: sesion } = await db.auth.getSession();
      if (!sesion.session) return error('Inicia sesión', 'Abre el panel de administración e inicia sesión para imprimir remisiones.');
      const [rAjustes, rPedidos] = await Promise.all([
        db.from('ajustes').select('*').single(),
        (() => {
          let consulta = db.from('pedidos')
            .select('id, folio, fecha_entrega, estado, notas, creado, clientes(nombre, telefono, direccion, horario_recepcion, instrucciones), pedido_lineas(sucursal_nombre, producto_nombre, presentacion, unidad, cantidad, precio_unitario, importe)')
            .order('folio');
          if (q.get('pedido')) consulta = consulta.eq('id', q.get('pedido'));
          else consulta = consulta.eq('fecha_entrega', q.get('fecha')).neq('estado', 'cancelado');
          return consulta;
        })(),
      ]);
      if (rAjustes.error || rPedidos.error) return error('No se pudo cargar', mensajeError(rAjustes.error || rPedidos.error));
      const a = rAjustes.data;
      const negocio = {
        nombre: a.nombre_negocio, color: a.color_acento, logo: a.logo, razon_social: a.razon_social, rfc: a.rfc,
        direccion: a.direccion, telefono: a.telefono, leyenda_remision: a.leyenda_remision,
      };
      const pedidos = rPedidos.data;
      if (!pedidos.length) {
        return error('Sin pedidos', q.get('fecha') ? `No hay pedidos para entregar el ${fechaLarga(q.get('fecha')).toLowerCase()}.` : 'No se encontró el pedido.');
      }
      const hojas = pedidos.map((p) => hoja(negocio, p.clientes || {}, { ...p, lineas: p.pedido_lineas.map(lineaPanel) }));
      mostrar(negocio, hojas, pedidos.length === 1
        ? `Remisión ${folioRemision(pedidos[0].folio)} · ${pedidos[0].clientes?.nombre || ''}`
        : `Remisiones del ${fechaLarga(q.get('fecha')).toLowerCase()}`);
    }

    async function desdeCliente() {
      const token = q.get('t');
      const folio = Number(q.get('folio'));
      const [rCliente, rPedidos] = await Promise.all([
        db.rpc('cliente_por_token', { p_token: token }),
        db.rpc('pedidos_por_token', { p_token: token }),
      ]);
      if (rCliente.error || rPedidos.error) return error('No se pudo cargar', mensajeError(rCliente.error || rPedidos.error));
      if (!rCliente.data) return error('Link no válido', 'Este link ya no funciona. Pide uno nuevo a tu proveedor.');
      const pedido = (rPedidos.data || []).find((p) => Number(p.folio) === folio);
      if (!pedido) return error('Pedido no encontrado', 'Solo se pueden descargar las notas de los pedidos recientes.');
      const negocio = rCliente.data.negocio;
      mostrar(negocio, [hoja(negocio, rCliente.data.cliente, pedido)], `Remisión ${folioRemision(pedido.folio)}`);
    }

    if (!db) error('Falta configurar', 'El sistema aún no está conectado a la base de datos.');
    else if (q.get('t') && q.get('folio')) desdeCliente();
    else if (q.get('pedido') || /^\d{4}-\d{2}-\d{2}$/.test(q.get('fecha') || '')) desdePanel();
    else error('Remisión no indicada', 'Abre la remisión desde un pedido del panel.');
  </script>
</body>
</html>
